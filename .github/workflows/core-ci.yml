name: LANA 3 CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify dev-215 known-good foundation
        run: python3 scripts/verify_dev215_foundation.py

      - name: Reject tracked private signing material
        shell: bash
        run: |
          mapfile -t blocked < <(git ls-files | grep -E -i "(^|/)([^/]+\\.(jks|keystore|p12|pfx|pkcs12)|local\\.properties|\\.env(\\..*)?)$" | grep -E -v "(\\.env\\.example|\\.env\\.sample)$" || true)

          if [ "${#blocked[@]}" -gt 0 ]; then
            echo "::error::Private signing/configuration material must not be tracked in Git."
            printf 'Blocked tracked file: %s\\n' "${blocked[@]}"
            exit 1
          fi

          echo "No blocked private signing/configuration files are tracked."
  shared-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.4"

      - name: Compile and test shared core
        run: gradle --no-daemon :shared:desktopTest

  android-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.4"

      - name: Verify official launcher icon
        run: python3 scripts/verify_android_icon.py

      - name: Verify Lana visual presence
        run: python3 scripts/verify_lana_presence.py

      - name: Run Android lint
        run: gradle --no-daemon :androidApp:lintDebug

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lana-3-android-lint
          path: androidApp/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build Android developer preview
        run: |
          gradle --no-daemon :androidApp:assembleDebug \
            -PlanaVersionCode=${GITHUB_RUN_NUMBER} \
            -PlanaVersionName="0.1.${GITHUB_RUN_NUMBER}-dev"

      - name: Verify Android application classes are packaged
        run: python3 scripts/verify_android_apk_classes.py androidApp/build/outputs/apk/debug/androidApp-debug.apk

      - name: Verify packaged launcher icon
        run: python3 scripts/verify_android_icon.py --apk androidApp/build/outputs/apk/debug/androidApp-debug.apk

      - name: Upload developer preview APK
        uses: actions/upload-artifact@v4
        with:
          name: lana-3-developer-preview
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error

  android-release-smoke:
    needs: [security-baseline, shared-core]
    runs-on: ubuntu-latest
    env:
      CI_SIGNING_PASSWORD: lana3-ci-smoke-only
      CI_SIGNING_ALIAS: lana3-ci-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.4"

      - name: Verify official launcher icon
        run: python3 scripts/verify_android_icon.py

      - name: Verify Lana visual presence
        run: python3 scripts/verify_lana_presence.py

      - name: Generate ephemeral CI signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/lana3-ci-smoke.jks" \
            -storetype JKS \
            -storepass "$CI_SIGNING_PASSWORD" \
            -keypass "$CI_SIGNING_PASSWORD" \
            -alias "$CI_SIGNING_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=LANA 3 CI Smoke,O=VAS CHARLIE,C=HR"

      - name: Build ephemeral signed release
        run: |
          gradle --no-daemon :androidApp:assembleRelease \
            -PlanaVersionCode=${GITHUB_RUN_NUMBER} \
            -PlanaVersionName="0.1.${GITHUB_RUN_NUMBER}-smoke" \
            -PlanaSigningStoreFile="$RUNNER_TEMP/lana3-ci-smoke.jks" \
            -PlanaSigningStorePassword="$CI_SIGNING_PASSWORD" \
            -PlanaSigningKeyAlias="$CI_SIGNING_ALIAS" \
            -PlanaSigningKeyPassword="$CI_SIGNING_PASSWORD"

      - name: Verify Android application classes are packaged in release
        run: python3 scripts/verify_android_apk_classes.py androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Verify packaged launcher icon in release
        run: python3 scripts/verify_android_icon.py --apk androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Verify ephemeral release signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Verify release checksum generation
        run: |
          cd androidApp/build/outputs/apk/release
          sha256sum androidApp-release.apk > androidApp-release.apk.sha256
          sha256sum -c androidApp-release.apk.sha256

      - name: Remove ephemeral signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/lana3-ci-smoke.jks"
  android-signed-release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [security-baseline, shared-core, android-preview, android-release-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LANA_SIGNING_KEY_B64: ${{ secrets.LANA_SIGNING_KEY_B64 }}
      LANA_SIGNING_STORE_PASSWORD: ${{ secrets.LANA_SIGNING_STORE_PASSWORD }}
      LANA_SIGNING_KEY_ALIAS: ${{ secrets.LANA_SIGNING_KEY_ALIAS }}
      LANA_SIGNING_KEY_PASSWORD: ${{ secrets.LANA_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Check private signing configuration
        id: signing
        run: |
          if [ -n "$LANA_SIGNING_KEY_B64" ] && \
             [ -n "$LANA_SIGNING_STORE_PASSWORD" ] && \
             [ -n "$LANA_SIGNING_KEY_ALIAS" ] && \
             [ -n "$LANA_SIGNING_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Private Android signing configuration is ready."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed APK publishing skipped until the LANA_SIGNING_* repository secrets are configured."
          fi

      - name: Checkout
        if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Set up Java 17
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        if: steps.signing.outputs.ready == 'true'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        if: steps.signing.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.4"

      - name: Restore private signing key
        if: steps.signing.outputs.ready == 'true'
        run: |
          printf '%s' "$LANA_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/lana3-release.jks"

      - name: Build signed update APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          gradle --no-daemon :androidApp:assembleRelease \
            -PlanaVersionCode=${GITHUB_RUN_NUMBER} \
            -PlanaVersionName="0.1.${GITHUB_RUN_NUMBER}-dev" \
            -PlanaSigningStoreFile="$RUNNER_TEMP/lana3-release.jks" \
            -PlanaSigningStorePassword="$LANA_SIGNING_STORE_PASSWORD" \
            -PlanaSigningKeyAlias="$LANA_SIGNING_KEY_ALIAS" \
            -PlanaSigningKeyPassword="$LANA_SIGNING_KEY_PASSWORD"

      - name: Verify packaged launcher icon in signed update
        if: steps.signing.outputs.ready == 'true'
        run: python3 scripts/verify_android_icon.py --apk androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Verify APK signature
        if: steps.signing.outputs.ready == 'true'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Publish latest LANA update
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-${GITHUB_RUN_NUMBER}"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk lana-3.apk
          sha256sum lana-3.apk > lana-3.apk.sha256
          sha256sum -c lana-3.apk.sha256
          gh release create "$TAG" lana-3.apk lana-3.apk.sha256 \
            --title "LANA 3 Developer Preview ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic update build. versionCode=${GITHUB_RUN_NUMBER}" \
            --latest

      - name: Remove restored private signing key
        if: always() && steps.signing.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/lana3-release.jks"
